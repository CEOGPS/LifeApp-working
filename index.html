<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ===================================================================
         Primary meta
         =================================================================== -->
    <title>CEO GPS | LifeOS1</title>
    <meta
      name="description"
      content="CEO GPS — Personal and Business Operating System. One login. Your entire life."
    />
    <meta name="application-name" content="CEO GPS" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL — update if the production domain changes -->
    <link rel="canonical" href="https://lifeos1.pages.dev/" />

    <!-- ===================================================================
         Icons
         =================================================================== -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- iOS home-screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-192.png" />

    <!-- ===================================================================
         PWA
         =================================================================== -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CEO GPS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ===================================================================
         OpenGraph
         =================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CEO GPS" />
    <meta property="og:title" content="CEO GPS | LifeOS1" />
    <meta
      property="og:description"
      content="CEO GPS — Personal and Business Operating System. One login. Your entire life."
    />
    <meta property="og:url" content="https://lifeos1.pages.dev/" />
    <meta property="og:image" content="https://lifeos1.pages.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CEO GPS — One login. Your entire life." />
    <meta property="og:locale" content="en_US" />

    <!-- ===================================================================
         Twitter / X
         =================================================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CEO GPS | LifeOS1" />
    <meta
      name="twitter:description"
      content="CEO GPS — Personal and Business Operating System. One login. Your entire life."
    />
    <meta name="twitter:image" content="https://lifeos1.pages.dev/og-image.png" />
    <meta name="twitter:image:alt" content="CEO GPS — One login. Your entire life." />
    <!-- <meta name="twitter:site" content="@yourhandle" /> -->
    <!-- <meta name="twitter:creator" content="@yourhandle" /> -->

    <!-- ===================================================================
         Fonts (non-blocking)
         Loads the stylesheet async; falls back gracefully if JS is off.
         =================================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      />
    </noscript>

    <!-- ===================================================================
         Vite-injected <script> and <link rel="stylesheet"> land here at build.
         Do not add them manually.
         =================================================================== -->
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem;
          color: #e5e7eb;
          background: #0a0a0f;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          text-align: center;
        "
      >
        <div>
          <h1 style="margin: 0 0 0.5rem; font-size: 1.5rem">CEO GPS requires JavaScript</h1>
          <p style="margin: 0; color: #9ca3af">
            Please enable JavaScript in your browser to use the dashboard.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
