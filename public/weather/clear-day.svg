<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><!-- LifeOS weather icon (clear-day). Original artwork generated for LifeOS, 2026. --><style>
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
.drift2{animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.drop{animation:fall 1.15s linear infinite}
@keyframes fall{0%{transform:translate(1px,-7px);opacity:0}25%{opacity:1}100%{transform:translate(-3px,15px);opacity:0}}
.flake{animation:snow 3.4s linear infinite}
@keyframes snow{0%{transform:translate(0,-6px);opacity:0}20%{opacity:1}100%{transform:translate(2px,16px);opacity:0}}
.bolt{animation:flash 3.6s linear infinite}
@keyframes flash{0%,62%,70%,100%{opacity:.7}64%,68%{opacity:1}66%{opacity:.5}}
.fog{animation:drift 9s ease-in-out infinite alternate}
.fog2{animation:drift 12s ease-in-out infinite alternate-reverse}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<filter id="fluff" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feGaussianBlur in="d" stdDeviation="0.55"/>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="hl" cx="0.4" cy="0.35" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".1"/><stop offset="1" stop-color="#f4fbff"/></linearGradient>
<radialGradient id="flakeG"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#eaf6ff" stop-opacity=".9"/><stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/></radialGradient>
<radialGradient id="iceG" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d8efff"/><stop offset="1" stop-color="#7fb4d9"/></radialGradient>
<radialGradient id="sunCore" cx=".42" cy=".4" r=".62"><stop offset="0" stop-color="#fffbe6"/><stop offset=".35" stop-color="#ffe27a"/><stop offset=".8" stop-color="#ffb321"/><stop offset="1" stop-color="#ff8a00"/></radialGradient><radialGradient id="sunHalo"><stop offset="0" stop-color="#ffc640" stop-opacity=".75"/><stop offset=".45" stop-color="#ff9d1c" stop-opacity=".32"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient><linearGradient id="rayG" x1="0" x2="1"><stop offset="0" stop-color="#fff3c4" stop-opacity="0"/><stop offset=".5" stop-color="#fff6d8"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></linearGradient></defs><g class="pulse"><circle cx="64" cy="64" r="59.8" fill="url(#sunHalo)"/></g><g opacity=".8" filter="url(#blur1)"><rect x="9.4" y="63.2" width="109.2" height="1.6" fill="url(#rayG)" transform="rotate(0 64 64)"/><rect x="9.4" y="63.2" width="109.2" height="1.6" fill="url(#rayG)" transform="rotate(90 64 64)"/><rect x="9.4" y="63.5" width="109.2" height="0.9" fill="url(#rayG)" transform="rotate(45 64 64)"/><rect x="9.4" y="63.5" width="109.2" height="0.9" fill="url(#rayG)" transform="rotate(135 64 64)"/></g><circle cx="64" cy="64" r="26" fill="url(#sunCore)" filter="url(#glow)"/></svg>
