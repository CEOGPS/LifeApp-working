(#cb10)"/><circle cx="65.2" cy="45.0" r="18.0" fill="url(#cb10)"/><circle cx="79.6" cy="54.0" r="13.5" fill="url(#cb10)"/><circle cx="88.6" cy="63.0" r="9.0" fill="url(#cb10)"/><circle cx="58.0" cy="63.0" r="15.3" fill="url(#cb10)"/><circle cx="31.0" cy="65.7" r="8.1" fill="url(#cb10)"/><circle cx="72.4" cy="64.8" r="12.6" fill="url(#cb10)"/><rect x="31.0" y="59.4" width="57.6" height="14.4" rx="7.2" fill="url(#cb10)"/><circle cx="49.0" cy="46.8" r="9.9" fill="url(#hl)" opacity=".85"/><circle cx="65.2" cy="40.5" r="11.7" fill="url(#hl)" opacity=".85"/><circle cx="79.6" cy="50.4" r="7.2" fill="url(#hl)" opacity=".85"/><circle cx="36.4" cy="57.6" r="6.3" fill="url(#hl)" opacity=".85"/></g></g><g class="fog"><rect x="16.0" y="72.0" width="88" height="7" rx="3.5" fill="url(#fogG)" opacity="0.75" filter="url(#blur1)"/></g><g class="fog2"><rect x="34.0" y="83.0" width="72" height="7" rx="3.5" fill="url(#fogG)" opacity="0.75" filter="url(#blur1)"/></g><g class="fog"><rect x="16.0" y="94.0" width="88" height="7" rx="3.5" fill="url(#fogG)" opacity="0.75" filter="url(#blur1)"/></g></svg>
