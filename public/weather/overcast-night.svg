<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><!-- LifeOS weather icon (overcast-night). Original artwork generated for LifeOS, 2026. --><style>
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
.drift2{animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.drop{animation:fall 1.15s linear infinite}
@keyframes fall{0%{transform:translate(1px,-7px);opacity:0}25%{opacity:1}100%{transform:translate(-3px,15px);opacity:0}}
.flake{animation:snow 3.4s linear infinite}
@keyframes snow{0%{transform:translate(0,-6px);opacity:0}20%{opacity:1}100%{transform:translate(2px,16px);opacity:0}}
.bolt{animation:flash 3.6s linear infinite}
@keyframes flash{0%,62%,70%,100%{opacity:.7}64%,68%{opacity:1}66%{opacity:.5}}
.fog{animation:drift 9s ease-in-out infinite alternate}
.fog2{animation:drift 12s ease-in-out infinite alternate-reverse}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<filter id="fluff" x="-25%" y="-25%" width="150%" height="150%">
